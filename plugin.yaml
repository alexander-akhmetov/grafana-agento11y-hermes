# No version key. For a pip-installed plugin hermes reads the version from the
# distribution metadata, not from here, so a number in this file only goes
# stale. See hermes_cli/plugins.py, discover_entrypoint_manifests.
name: agento11y
description: "Grafana Agent Observability for Hermes. Records LLM calls and tool usage as generations and OTel traces+metrics."
author: Alexander Akhmetov
requires_env:
  - name: AGENTO11Y_ENDPOINT
    description: "Generations API URL, e.g. https://sigil-prod-<region>.grafana.net"
  - name: AGENTO11Y_PROTOCOL
    description: "Generations export protocol, http for Grafana Cloud"
  - name: AGENTO11Y_AUTH_MODE
    description: "Generations auth mode, basic for Grafana Cloud"
  - name: AGENTO11Y_AUTH_TENANT_ID
    description: "Grafana Cloud stack ID (basic-auth user)"
  - name: AGENTO11Y_AUTH_TOKEN
    description: "Grafana Cloud token with sigil:write scope"
    secret: true
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    description: "Grafana Cloud OTLP gateway base URL, e.g. https://otlp-gateway-prod-<region>.grafana.net/otlp"
  - name: OTEL_EXPORTER_OTLP_HEADERS
    description: "OTLP auth header. Optional: derived from AGENTO11Y_AUTH_* when unset"
    secret: true
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - pre_tool_call
  - post_tool_call
  - on_session_end
