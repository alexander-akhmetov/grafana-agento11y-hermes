name: Release

on:
  push:
    tags:
      # Also matches a pre-release such as 0.6.0rc1 or 0.6.0-rc1.
      - "[0-9]+.[0-9]+.[0-9]+*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the artifacts
      id-token: write # OIDC token for the provenance attestation
      attestations: write
    steps:
      # hatch-vcs derives the version from git tags. A shallow clone has none,
      # and produces a wrong dev version instead of failing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # A tag can point at any commit, so do not assume CI already passed here.
      - name: Test
        run: |
          make sync
          make test

      - name: Build
        run: make build

      # hatch-vcs appends a dev segment when HEAD is not exactly on the tag or
      # the tree is dirty. A dev version must not ship as a release.
      #
      # The comparison is on the parsed version, not the string: PEP 440
      # normalizes a 0.6.0-rc1 tag to 0.6.0rc1 in the filename.
      - name: Check built version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          wheel="$(ls dist/*.whl)"
          built="$(basename "${wheel}" | cut -d- -f2)"
          echo "tag=${TAG} built=${built}"
          uv run --with packaging python - "${TAG}" "${built}" <<'PY'
          import sys

          from packaging.version import Version

          tag, built = sys.argv[1], sys.argv[2]
          if Version(tag) != Version(built):
              print(f"::error::built version {built} does not match tag {tag}")
              sys.exit(1)
          PY

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      # Generated once, from the tag, and handed to changelog-pr as an artifact,
      # so the release notes and CHANGELOG.md cannot disagree.
      - name: Generate the changelog section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ./scripts/changelog-for-release.sh "$TAG" "" "$TAG" > changelog-section.md
          # The release title already carries the version, so the notes drop the
          # heading. They keep the short hashes that the changelog file omits.
          ./scripts/changelog-for-release.sh --no-heading --hashes "$TAG" "" "$TAG" > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --notes-file release-notes.md --verify-tag

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog-section
          path: changelog-section.md
          if-no-files-found: error

  # Separate job so the OIDC token is scoped to the pypi environment the
  # trusted publisher is bound to, and so a failed upload can be re-run on its
  # own instead of re-running `gh release create` against an existing release.
  #
  # Last, because it is the only irreversible step. A PyPI version can never be
  # uploaded twice; a GitHub release can be deleted and recreated.
  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/grafana-agento11y-hermes
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Trusted publishing: no API token, the action mints one from the OIDC
      # token. Configured at https://pypi.org/manage/account/publishing/.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # The tag is what releases, so CHANGELOG.md on main is a record written after
  # the fact. It goes through a PR rather than a push to main.
  changelog-pr:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the branch
      pull-requests: write # open the PR
    steps:
      # main, not the tag: the section is written against whatever main holds
      # now, which can already be ahead of the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changelog-section
          path: ${{ runner.temp }}/changelog

      # The section the build job generated from the tag. Inserting a version
      # the file already has is a no-op, so a re-run cannot duplicate it.
      - name: Insert the section into CHANGELOG.md
        run: ./scripts/insert-changelog-section.sh CHANGELOG.md < "${RUNNER_TEMP}/changelog/changelog-section.md"

      - name: Open the pull request
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          BRANCH="changelog-${TAG}"
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          # changelog-for-release.sh drops this subject from the next release,
          # so the bookkeeping commit never becomes a bullet.
          git commit -m "Release ${TAG}: changelog"
          git push -u origin "$BRANCH"
          if ! gh pr view "$BRANCH" &>/dev/null; then
            gh pr create --title "Release ${TAG}: changelog" \
              --body "CHANGELOG.md entry for ${TAG}, generated from the tag by the release workflow." \
              --base main
          fi
